<!-- INSTITUTIONAL QUANT ENGINE STYLES (ROYAL BLUE THEME) -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap');

:root {
  --bg-primary: #0a192f;
  --bg-gradient: linear-gradient(135deg, #020c1b 0%, #0a192f 50%, #172a45 100%);
  --bg-card: rgba(13, 37, 69, 0.75);
  --royal-blue: #1d4ed8;
  --royal-glow: #2563eb;
  --cyan-glow: #00f2fe;
  --border-glow: rgba(0, 242, 254, 0.35);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

body {
  background: var(--bg-gradient);
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--text-main);
  margin: 0;
  padding: 0;
}

/* TOP LIVE MARKET TICKER BAR */
.live-ticker-wrapper {
  background: rgba(2, 12, 27, 0.95);
  border-bottom: 1px solid var(--border-glow);
  position: sticky;
  top: 0;
  z-index: 1000;
  backdrop-filter: blur(12px);
}

/* HIGH-IMPACT ROYAL BLUE HERO BANNER */
.hero-glass-box {
  background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.35), transparent 75%), var(--bg-card);
  border: 1px solid var(--border-glow);
  box-shadow: 0 20px 50px rgba(2, 12, 27, 0.8), 0 0 35px rgba(37, 99, 235, 0.25);
  padding: 3.5rem 2.5rem;
  border-radius: 28px;
  margin: 30px auto;
  max-width: 1100px;
  text-align: center;
  position: relative;
  backdrop-filter: blur(16px);
}

.institutional-badge-strip {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: rgba(29, 78, 216, 0.3);
  border: 1px solid var(--cyan-glow);
  padding: 8px 24px;
  border-radius: 50px;
  margin-bottom: 25px;
  box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
}

.badge-tag {
  color: #ffffff;
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.accuracy-chip {
  background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 6px;
  box-shadow: 0 0 15px rgba(255, 8, 68, 0.6);
}

.hero-title {
  font-size: 2.9rem;
  font-weight: 900;
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin: 0 0 15px 0;
  background: linear-gradient(180deg, #ffffff 40%, #93c5fd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-subtitle {
  color: var(--cyan-glow);
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 25px;
}

.hero-quote {
  max-width: 780px;
  margin: 0 auto;
  font-size: 1.15rem;
  color: #e2e8f0;
  line-height: 1.7;
  border-left: 3px solid var(--cyan-glow);
  padding-left: 20px;
  text-align: left;
  font-style: italic;
}

/* SMALL COMING SOON APP & SOCIAL CONNECT WINDOW */
.app-coming-window {
  max-width: 1100px;
  margin: 25px auto;
  padding: 20px 28px;
  background: linear-gradient(90deg, rgba(13, 37, 69, 0.88) 0%, rgba(29, 78, 216, 0.25) 100%);
  border: 1px solid var(--border-glow);
  border-radius: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  box-shadow: 0 10px 30px rgba(2, 12, 27, 0.6);
  backdrop-filter: blur(12px);
}

.app-window-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.coming-pill {
  background: rgba(0, 242, 254, 0.15);
  border: 1px solid var(--cyan-glow);
  color: var(--cyan-glow);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  font-weight: 800;
  padding: 5px 12px;
  border-radius: 50px;
  letter-spacing: 1px;
  text-transform: uppercase;
  white-space: nowrap;
}

.app-window-text h4 {
  margin: 0 0 3px 0;
  font-size: 1.05rem;
  font-weight: 800;
  color: #ffffff;
}

.app-window-text p {
  margin: 0;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.social-links-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.social-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 15px;
  border-radius: 10px;
  font-size: 0.83rem;
  font-weight: 700;
  text-decoration: none;
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.15);
  transition: all 0.25s ease;
}

.social-btn.yt { background: rgba(220, 38, 38, 0.28); border-color: rgba(239, 68, 68, 0.5); }
.social-btn.yt:hover { background: #dc2626; }

.social-btn.li { background: rgba(29, 78, 216, 0.35); border-color: rgba(59, 130, 246, 0.5); }
.social-btn.li:hover { background: #1d4ed8; }

.social-btn.wa { background: rgba(5, 150, 105, 0.28); border-color: rgba(16, 185, 129, 0.5); }
.social-btn.wa:hover { background: #059669; }

/* 4-PILLAR QUANT INFRASTRUCTURE */
.architecture-container {
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 20px;
}

.section-tagline {
  color: var(--cyan-glow);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  letter-spacing: 2px;
  font-weight: 700;
  text-transform: uppercase;
}

.section-head {
  font-size: 2.1rem;
  font-weight: 800;
  color: #ffffff;
  margin: 8px 0 35px 0;
}

.pillar-matrix {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}

.matrix-card {
  background: var(--bg-card);
  border: 1px solid rgba(0, 242, 254, 0.15);
  border-radius: 20px;
  padding: 2.2rem;
  position: relative;
  transition: all 0.3s ease;
  backdrop-filter: blur(12px);
}

.matrix-card:hover {
  transform: translateY(-5px);
  border-color: var(--cyan-glow);
  box-shadow: 0 15px 35px rgba(29, 78, 216, 0.35);
}

.card-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--cyan-glow);
  opacity: 0.6;
  margin-bottom: 12px;
}

.card-title {
  color: #ffffff;
  font-size: 1.25rem;
  font-weight: 800;
  margin-bottom: 12px;
}

.card-desc {
  color: var(--text-muted);
  font-size: 0.98rem;
  line-height: 1.65;
  margin: 0;
}

/* MACRO METRICS BAR */
.metrics-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 20px;
}

.metric-cell {
  background: rgba(13, 37, 69, 0.6);
  border: 1px solid rgba(0, 242, 254, 0.2);
  border-radius: 18px;
  padding: 25px;
